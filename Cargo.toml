[package]
name = "rust-stream-player"
version = "0.1.0"
edition = "2021"

[dependencies]
# Existing dependencies
reqwest = { version = "0.12", features = ["stream"] }
tokio = { version = "1", features = ["full"] }
ffmpeg-next = "7.1.0"
log = "0.4"
env_logger = "0.10"

# New essential dependencies for complete implementation
sdl2 = { version = "0.36", features = ["bundled"] }
rodio = "0.17"
crossbeam-channel = "0.5"
anyhow = "1.0"
thiserror = "1.0"
serde_json = "1.0.143"

# For GUI (optional - can be enabled later)
# egui = { version = "0.24", optional = true }
# egui-winit = { version = "0.24", optional = true }
# egui_glow = { version = "0.24", optional = true }

[features]
default = []
# gui = ["egui", "egui-winit", "egui_glow"]